version = 0.1

[default]
[default.deploy]
[default.deploy.parameters]
stack_name = "hakuba-backend"
s3_prefix = "hakuba-backend"
region = "ap-southeast-2"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = true
resolve_s3 = true
disable_rollback = false
parameter_overrides = "StageName=\"dev\" DomainPrefix=\"hakuba-dev\" AllowedCallbackUrls=\"hakuba://callback,https://localhost\" AllowedLogoutUrls=\"hakuba://signout,https://localhost\""
image_repositories = []
